services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: todo_list
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - task_data:/var/lib/mysql

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root_password
      DB_NAME: todo_list
    volumes:
      # On monte le code du backend dans /app/backend pour correspondre au Dockerfile
      - ./backend:/app/backend
      # On monte le dossier frontend à côté pour que "../frontend" dans server.js fonctionne
      - ./frontend:/frontend
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173" # Port par défaut de Vite
    volumes:
      - ./frontend:/app
      - /app/node_modules # Protège les modules installés dans le conteneur
    environment:
      - VITE_API_URL=http://localhost:5000 # Pour que ton front sache où est l'API
    depends_on:
      - backend

volumes:
  task_data: